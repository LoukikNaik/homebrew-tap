name: Install PodClipper

on:
  workflow_dispatch:
  push:
    paths:
      - Formula/**
      - .github/workflows/install-podclipper.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          test "$(uname -m)" = arm64
          test ! -d "$(brew --cellar)/podclipper"
          brew tap loukiknaik/tap "$GITHUB_WORKSPACE"
          brew install loukiknaik/tap/podclipper
      - name: Check installed command and dependencies
        run: |
          podclipper --help
          ffmpeg -version
          ffprobe -version
          "$(brew --prefix podclipper)/libexec/bin/python" -c "import faster_whisper, cv2, mediapipe, ultralytics, litellm; from importlib.metadata import version; print('PodClipper', version('podclipper'))"
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --python="$(brew --prefix podclipper)/libexec/bin/python" check
      - name: Check first-time setup without an API key
        run: |
          mkdir "$RUNNER_TEMP/podclipper-onboarding"
          cd "$RUNNER_TEMP/podclipper-onboarding"
          podclipper init
          test -f .env
          test -f podclipper.yaml
      - name: Find the installed release
        id: release
        run: |
          "$(brew --prefix podclipper)/libexec/bin/python" -c "from importlib.metadata import version; print('tag=v' + version('podclipper'))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: LoukikNaik/PodClipper
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
      - name: Install pytest tools in the installed environment
        run: |
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --python="$(brew --prefix podclipper)/libexec/bin/python" install "pytest>=8" "pytest-mock>=3.12" "pytest-cov>=5"
      - name: Run the release's pytest suite against the installed package
        working-directory: release-source
        env:
          PYTHONPATH: ""
        run: |
          "$(brew --prefix podclipper)/libexec/bin/python" -c "import podclipper; from pathlib import Path; assert Path(podclipper.__file__).is_relative_to(Path('/opt/homebrew/Cellar/podclipper')), podclipper.__file__; print(podclipper.__file__)"
          "$(brew --prefix podclipper)/libexec/bin/python" -m pytest -o pythonpath= --import-mode=importlib --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-pytest-results
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: ignore

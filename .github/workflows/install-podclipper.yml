name: Install PodClipper

on:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the real video pipeline using temporary LLM secrets"
        required: false
        default: false
        type: boolean
      tests_ref:
        description: "Optional PodClipper test ref; defaults to the installed release tag"
        required: false
        type: string
  push:
    paths:
      - Formula/**
      - .github/workflows/install-podclipper.yml

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          test "$(uname -m)" = arm64
          test ! -d "$(brew --cellar)/podclipper"
          brew tap loukiknaik/tap "$GITHUB_WORKSPACE"
          brew install loukiknaik/tap/podclipper
      - name: Check installed command and dependencies
        run: |
          podclipper --help
          ffmpeg -version
          ffprobe -version
          "$(brew --prefix podclipper)/libexec/bin/python" -c "import faster_whisper, cv2, mediapipe, ultralytics, litellm; from importlib.metadata import version; print('PodClipper', version('podclipper'))"
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --python="$(brew --prefix podclipper)/libexec/bin/python" check
      - name: Check first-time setup without an API key
        run: |
          mkdir "$RUNNER_TEMP/podclipper-onboarding"
          cd "$RUNNER_TEMP/podclipper-onboarding"
          podclipper init
          test -f .env
          test -f podclipper.yaml
      - name: Find the installed release
        id: release
        run: |
          "$(brew --prefix podclipper)/libexec/bin/python" -c "from importlib.metadata import version; print('tag=v' + version('podclipper'))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: LoukikNaik/PodClipper
          ref: ${{ inputs.tests_ref || steps.release.outputs.tag }}
          path: release-source
      - name: Install pytest tools in the installed environment
        run: |
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip --python="$(brew --prefix podclipper)/libexec/bin/python" install "pytest>=8" "pytest-mock>=3.12" "pytest-cov>=5"
      - name: Run pytest against the installed package
        working-directory: release-source
        env:
          PYTHONPATH: ""
        run: |
          "$(brew --prefix podclipper)/libexec/bin/python" -c "import podclipper; from pathlib import Path; assert Path(podclipper.__file__).is_relative_to(Path('/opt/homebrew/Cellar/podclipper')), podclipper.__file__; print(podclipper.__file__)"
          "$(brew --prefix podclipper)/libexec/bin/python" -m pytest -o pythonpath= --import-mode=importlib --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-pytest-results
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: ignore
      - name: Run the full video pipeline from scratch
        if: inputs.e2e
        env:
          LLM_API_KEY: ${{ secrets.PODCLIPPER_E2E_KEY_011 }}
          LLM_ENDPOINT: ${{ secrets.PODCLIPPER_E2E_HOST_011 }}
          LLM_MODEL: ${{ secrets.PODCLIPPER_E2E_MODEL_011 }}
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          test -n "$LLM_API_KEY"
          test -n "$LLM_ENDPOINT"
          test -n "$LLM_MODEL"
          mkdir "$RUNNER_TEMP/podclipper-e2e"
          cd "$RUNNER_TEMP/podclipper-e2e"
          curl --fail --location --retry 3 'https://py.tedcdn.com/consus/projects/00/20/33/005/products/2009g-dan-pink-005-fallback-f1b96462359a7383b5bc217e250a6784-1200k.mp4' -o original.mp4
          ffmpeg -nostdin -v error -i original.mp4 -t 300 -c:v libx264 -preset fast -crf 23 -c:a aac source.mp4
          podclipper init
          test ! -e .cache
          podclipper source.mp4 --clips 1 --output-dir outputs -v 2>&1 | tee run.log
          "$(brew --prefix podclipper)/libexec/bin/python" "$GITHUB_WORKSPACE/scripts/verify_e2e.py" "$PWD"
      - name: Remove credentials from the saved log
        if: always() && inputs.e2e
        env:
          LLM_API_KEY: ${{ secrets.PODCLIPPER_E2E_KEY_011 }}
        run: |
          "$(brew --prefix podclipper)/libexec/bin/python" - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "podclipper-e2e/run.log"
          key = os.environ.get("LLM_API_KEY")
          if path.exists() and key:
              path.write_text(path.read_text().replace(key, "[REDACTED]"))
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.e2e
        with:
          name: podclipper-e2e
          retention-days: 7
          path: |
            ${{ runner.temp }}/podclipper-e2e/outputs/
            ${{ runner.temp }}/podclipper-e2e/previews/
            ${{ runner.temp }}/podclipper-e2e/media_checks.json
            ${{ runner.temp }}/podclipper-e2e/run.log
          if-no-files-found: ignore
